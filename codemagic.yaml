workflows:
  ios_build:
    name: "Build iOS IPA & Simulator APP"
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      # ─────────────────────────────────────────
      # Flutter Get
      # ─────────────────────────────────────────
      - name: "Flutter pub get"
        script: |
          flutter pub get

      # ─────────────────────────────────────────
      # Build iOS IPA for real device
      # ─────────────────────────────────────────
      - name: "Build iOS IPA (release)"
        script: |
          flutter build ipa --release

      # ─────────────────────────────────────────
      # Build iOS Simulator APP (.app)
      # ─────────────────────────────────────────
      - name: "Build iOS Simulator APP"
        script: |
          flutter build ios --debug --simulator

    artifacts:
      - build/ios/ipa/*.ipa                       # iPhone için IPA
      - build/ios/Debug-iphonesimulator/*.app     # Simulator için .app

    publishing:
      email:
        recipients:
          - "your-email@example.com"


