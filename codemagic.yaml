workflows:
  ios-simulator:
    name: iOS Simulator Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS Simulator App
        script: |
          flutter build ios --debug --simulator

    artifacts:
      - build/ios/iphonesimulator/*.app

    publishing:
      email:
        recipients:
          - bilgi@example.com
