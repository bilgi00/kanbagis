  <!-- Loading Animation CSS -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #E53935;
      font-family: 'Roboto', sans-serif;
    }
    
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #E53935, #C62828);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      background-color: white;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      margin-bottom: 32px;
      animation: pulse 2s infinite;
    }
    
    .loading-logo::before {
      content: "🩸";
      font-size: 48px;
    }
    
    .loading-title {
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .loading-subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      margin-bottom: 32px;
      text-align: center;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-tips {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      max-width: 300px;
    }
    
    @media (max-width: 768px) {
      .loading-title { font-size: 24px; }
      .loading-subtitle { font-size: 14px; }
      .loading-logo { width: 80px; height: 80px; }
      .loading-logo::before { font-size: 32px; }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading" class="loading-container">
    <div class="loading-logo"></div>
    <div class="loading-title">Bir Damla Kan</div>
    <div class="loading-subtitle">Hayat Kurtaran Platform</div>
    <div class="loading-spinner"></div>
    <div class="loading-tips">
      💡 Kan bağışı yapmadan önce hastane ile iletişime geçmeyi unutmayın
    </div>
  </div>

  <script>
    // Hide loading screen when Flutter app is ready
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s ease-out';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      }
    });
    
    // Fallback: Hide loading after 10 seconds
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.style.display = 'none';
      }
    }, 10000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
